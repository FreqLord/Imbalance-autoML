# Optuna hyperparameter bounds per model family

dummy:
  strategy:
    type: categorical
    choices: ["stratified", "most_frequent", "prior"]

logistic_regression:
  C:
    type: float
    low: 1e-4
    high: 1e2
    log: true
  penalty:
    type: categorical
    choices: ["l1", "l2", "elasticnet"]
  solver:
    type: categorical
    choices: ["saga"]

random_forest:
  n_estimators:
    type: int
    low: 50
    high: 500
  max_depth:
    type: int
    low: 3
    high: 12
  min_samples_split:
    type: int
    low: 2
    high: 20
  class_weight:
    type: categorical
    choices: ["balanced", "balanced_subsample", null]

lightgbm:
  n_estimators:
    type: int
    low: 50
    high: 1000
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  num_leaves:
    type: int
    low: 15
    high: 127
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
  scale_pos_weight:
    type: float
    low: 1.0
    high: 100.0

catboost:
  iterations:
    type: int
    low: 100
    high: 1000
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  depth:
    type: int
    low: 3
    high: 10
  auto_class_weights:
    type: categorical
    choices: ["None", "Balanced", "SqrtBalanced"]

xgboost:
  n_estimators:
    type: int
    low: 50
    high: 1000
  learning_rate:
    type: float
    low: 0.01
    high: 0.3
    log: true
  max_depth:
    type: int
    low: 3
    high: 10
  subsample:
    type: float
    low: 0.5
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0
  scale_pos_weight:
    type: float
    low: 1.0
    high: 100.0
