[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-imbalanced-pipeline"
version = "0.1.0"
description = "Industrial-grade AutoML pipeline specialized for high class imbalance, temporal data, and asymmetric business costs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5.0",
    "imbalanced-learn>=0.12.0",
    "optuna>=3.6.0",
    "skops>=0.10.0",
    "catboost>=1.2.5",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.3",
    "shap>=0.45.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0",
    "mlflow>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
